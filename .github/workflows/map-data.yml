name: Données carte (trajets OSM et captures)

# Calcule les tracés des Cartes du jour sur OpenStreetMap et photographie la carte avec les vraies
# tuiles, puis enregistre le résultat sur la branche. Lancé à la main ou quand les trajets changent.
on:
  push:
    branches: ["travelos-*"]
    paths:
      - "travelos/routes/*.json"
      - "tools/osm-routes.py"
      - "tools/osm-discover.py"
      - "tools/park-calibrate.py"
      - "tools/osmlocal.py"
      - "tools/osm-prepare.sh"
      - "tools/osm-fetch.py"
      - "tools/map-preview.py"
      - "android/app/src/main/assets/ui/**"
      - "android/app/src/main/assets/map/**"
      - ".github/workflows/map-data.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: travelos-map-data
  cancel-in-progress: true

jobs:
  data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Extraits OpenStreetMap (cache d'une semaine)
        id: semaine
        run: echo "w=$(date +%G-%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: osmcache
        with:
          path: .osm
          key: osm-${{ steps.semaine.outputs.w }}-v4
      - name: Préparer OpenStreetMap en local
        timeout-minutes: 90
        run: |
          set -o pipefail
          mkdir -p travelos/routes/osm
          { pip install -q numpy scipy pillow && bash tools/osm-prepare.sh; } 2>&1 | tee travelos/routes/osm/prepare.log \
            || { tail -8 travelos/routes/osm/prepare.log | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }

      - name: Garder les données OSM en cache (même si la suite échoue)
        if: steps.osmcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .osm
          key: osm-${{ steps.semaine.outputs.w }}-v4

      - name: Inventaire OpenStreetMap
        run: python3 -u tools/osm-discover.py 2>&1 | tail -5

      - name: Caler le plan illustré de Disneyland
        if: hashFiles('travelos/routes/hkdl-calage.json') != ''
        run: |
          set -o pipefail
          python3 tools/park-calibrate.py 2>&1 | tee travelos/routes/osm/hkdl-calage.log

      - name: Tracer les trajets sur OpenStreetMap
        timeout-minutes: 60
        run: |
          set -o pipefail
          mkdir -p travelos/routes/osm travelos/preview
          python3 -u tools/osm-routes.py 2>&1 | tee travelos/routes/osm/trajets.log

      - name: Signaler les erreurs du tracé
        if: failure()
        run: tail -7 travelos/routes/osm/trajets.log | while IFS= read -r l; do echo "::error::$l"; done

      - name: Refaire le paquet
        run: node tools/build-pack.mjs

      - name: Photographier la Carte du jour (vraies tuiles)
        if: hashFiles('tools/map-preview.py') != ''
        continue-on-error: true
        run: |
          set -o pipefail
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
          python3 tools/map-preview.py 2>&1 | tee travelos/preview/map-preview.log || { tail -30 travelos/preview/map-preview.log | while IFS= read -r l; do echo "::warning::$l"; done; exit 1; }

      - name: Enregistrer sur la branche
        if: always()
        run: |
          git config user.name "travelos-bot"
          git config user.email "travelos-bot@users.noreply.github.com"
          git add travelos/routes/osm travelos/pack android/app/src/main/assets/seed android/app/src/main/assets/map travelos/preview 2>/dev/null || true
          git diff --cached --quiet && { echo "Rien de neuf"; exit 0; }
          git commit -m "Carte du jour : trajets OSM et captures (automatique)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
