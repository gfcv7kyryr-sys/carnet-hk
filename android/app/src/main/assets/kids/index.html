<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Le carnet de Charlie</title>
<style>
  /* Charte du carnet : papier, scotch kraft, un seul feutre noir, un seul surligneur jaune. */
  :root{--ink:#2B2420;--hl:#F7E08A;--kraft:#E8D3A8;--tape:rgba(217,198,160,.78);--paper:#FBF6EC;--card:#FFFDF6}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--paper);color:var(--ink);font-family:"Caveat","Comic Sans MS","Segoe Print",cursive;
    background-image:radial-gradient(rgba(43,36,32,.05) 1px,transparent 1px);background-size:22px 22px;
    display:grid;place-items:center;padding:48px 32px;overflow:hidden}
  .page{width:min(880px,100%);display:grid;gap:36px;justify-items:center;text-align:center}
  h1{margin:0;font-size:clamp(3rem,8vw,5.2rem);line-height:1;font-weight:700;position:relative;display:inline-block}
  h1 span{background:linear-gradient(transparent 55%,var(--hl) 55%,var(--hl) 92%,transparent 92%);padding:0 .15em}
  .polaroid{background:#fff;padding:18px 18px 64px;box-shadow:0 18px 40px -18px rgba(43,36,32,.45);transform:rotate(-2.5deg);position:relative;width:min(420px,80vw)}
  .polaroid::before,.polaroid::after{content:"";position:absolute;top:-16px;width:120px;height:34px;background:var(--tape)}
  .polaroid::before{left:-30px;transform:rotate(-28deg)}
  .polaroid::after{right:-30px;transform:rotate(28deg)}
  .scene{aspect-ratio:1;background:linear-gradient(160deg,#FFE3B0,#F7A86B 55%,#C4161C);display:grid;place-items:center;font-size:9rem;color:#fff;
    font-family:"PingFang HK","Noto Sans CJK TC",sans-serif;font-weight:200}
  .polaroid p{position:absolute;left:0;right:0;bottom:16px;margin:0;font-size:2rem}
  .card{background:var(--card);padding:26px 34px;font-size:clamp(1.7rem,3.6vw,2.3rem);line-height:1.35;
    background-image:repeating-linear-gradient(transparent 0 43px,rgba(43,36,32,.12) 43px 44px);transform:rotate(1deg);
    box-shadow:0 12px 30px -16px rgba(43,36,32,.4);max-width:640px;position:relative}
  .card::before{content:"";position:absolute;top:-14px;left:50%;width:110px;height:30px;margin-left:-55px;background:var(--tape);transform:rotate(-3deg)}
  .count{font-size:clamp(4rem,12vw,7rem);font-weight:700;line-height:1}
  .label{display:inline-block;background:var(--kraft);padding:8px 22px;font-family:"Special Elite","Courier New",monospace;font-size:1.1rem;letter-spacing:.06em;transform:rotate(-1.5deg)}
</style>
</head>
<body>
  <main class="page">
    <h1><span>Le carnet de Charlie</span></h1>
    <figure class="polaroid">
      <div class="scene" aria-hidden="true">龍</div>
      <p>Xiao Long prépare la valise</p>
    </figure>
    <div class="card">
      <div class="count" id="count">…</div>
      <div id="sleeps">dodos avant Hong Kong</div>
    </div>
    <div class="label">BIENTÔT : UNE HISTOIRE PAR JOUR</div>
  </main>
<script>
  // Nombre de nuits avant le départ (20 février 2027), en heure locale de la tablette.
  (function () {
    var start = new Date(2027, 1, 20);
    var today = new Date(); today.setHours(0, 0, 0, 0);
    var n = Math.round((start - today) / 86400000);
    var count = document.getElementById("count");
    var sleeps = document.getElementById("sleeps");
    if (n > 0) { count.textContent = n; sleeps.textContent = n > 1 ? "dodos avant Hong Kong" : "dodo avant Hong Kong"; }
    else { count.textContent = "C'est parti !"; sleeps.textContent = "Xiao Long ouvre la valise"; }
  })();
</script>
</body>
</html>
