<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Carnet de voyage</title>
<link rel="stylesheet" href="../vendor/maplibre/maplibre-gl.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
  <!-- Choix du profil, affiché à chaque démarrage -->
  <section id="chooser" class="chooser" hidden>
    <div class="chooser-wall" aria-hidden="true"></div><div class="chooser-blur" aria-hidden="true"></div>
    <div class="chooser-in">
      <h1>Qui voyage ?</h1>
      <div class="profiles">
        <button class="profile" data-profile="jonas">
          <span class="ring"><span class="disc"><b>J</b><img src="profiles/jonas.webp" alt="" onload="this.parentNode.classList.add('has-img')" onerror="this.remove()"></span></span>
          <strong>Jonas</strong>
        </button>
        <button class="profile" data-profile="eric">
          <span class="ring"><span class="disc"><b>É</b><img src="profiles/eric.webp" alt="" onload="this.parentNode.classList.add('has-img')" onerror="this.remove()"></span></span>
          <strong>Éric</strong>
        </button>
        <button class="profile" data-profile="charlie">
          <span class="ring"><span class="disc"><b>C</b><img src="profiles/charlie.webp" alt="" onload="this.parentNode.classList.add('has-img')" onerror="this.remove()"></span></span>
          <strong>Charlie</strong>
        </button>
      </div>
    </div>
  </section>

  <!-- Profil Pilote -->
  <div id="pilote" hidden>
    <header class="top glass">
      <button class="avatar" id="switchProfile" aria-label="Changer de profil"><span class="han">港</span></button>
      <b id="pageTitle">Aujourd'hui</b>
      <span class="tstat" id="topStatus"></span>
      <span class="clock" id="clockHk">--:--</span>
      <button class="gear" data-tab="more" aria-label="Plus et réglages">⚙︎</button>
    </header>
    <main id="view"></main>
    <nav class="bar glass" id="tabbar">
      <span class="lens" id="lens"></span>
      <button data-tab="today"><span class="g han">今</span>Aujourd'hui</button>
      <button data-tab="programme"><span class="g han">日</span>Programme</button>
      <button data-tab="places"><span class="g han">地</span>Lieux</button>
      <button data-tab="food"><span class="g han">食</span>Repas</button>
      <button data-tab="guide"><span class="g han">解</span>Guide</button>
      <button data-tab="pocket"><span class="g han">袋</span>Poche</button>
    </nav>
  </div>

  <!-- Profil Carnet (Charlie) -->
  <section id="kids" class="kids" hidden>
    <button class="kids-exit" id="kidsExit" aria-label="Quitter le carnet (appui long)"><span class="han">龍</span></button>
    <main class="kids-page" id="kidsHome">
      <h1><span>Le carnet de Charlie</span></h1>
      <div class="kids-count"><b id="kidsCount">…</b> <span id="kidsSleeps">dodos avant Hong Kong</span></div>
      <div class="kids-doors">
        <button class="kdoor" data-kid="carnet"><span class="kd-img tone-gz"><b>龍</b></span><strong>Mon carnet</strong></button>
        <button class="kdoor" data-kid="color"><span class="kd-img tone-mo"><b>🖍</b></span><strong>Coloriages</strong></button>
        <button class="kdoor" data-kid="story"><span class="kd-img tone-li"><b>📖</b></span><strong>Histoires</strong></button>
      </div>
    </main>
    <main class="kids-sub" id="kidsSub" hidden></main>
  </section>

  <!-- Fiche plein écran (lieu, journée) -->
  <div id="sheet" class="sheet" hidden>
    <div class="sheet-top"><button class="round glass" data-close aria-label="Fermer">‹</button><span id="sheetTitle"></span></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>

  <!-- Texte à montrer (chauffeur, serveur) -->
  <div id="show" class="show" hidden>
    <button class="round glass show-x" data-close-show aria-label="Fermer">×</button>
    <div class="show-in"><div class="show-big han" id="showBig"></div><div class="show-alt han" id="showAlt"></div><p id="showFr"></p></div>
  </div>

  <div id="toast" class="toast" hidden></div>
  <audio id="player" preload="none"></audio>
  <div id="miniPlayer" class="mini-player glass" hidden>
    <div class="mp-ctl">
      <button id="mpShuffle" class="mp-b dim" aria-label="Lecture aléatoire" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M17 3l4 4-4 4V8h-2.6l-7 8H3v-2h3.6l7-8H17zM3 6h4.4l2.1 2.4-1.3 1.5L6.6 8H3zm11.4 8.1 1.3-1.5L17 14v-3l4 4-4 4v-3h-2.6z"/></svg></button>
      <button id="mpPrev" class="mp-b" aria-label="Piste précédente"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path fill="currentColor" d="M11.5 12 21 5.5v13zM2.5 12 12 5.5v13z"/></svg></button>
      <button id="mpToggle" class="mp-b big" aria-label="Lecture ou pause"><span class="ic-pause"><svg viewBox="0 0 24 24" width="36" height="36" aria-hidden="true"><path fill="currentColor" d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg></span><span class="ic-play"><svg viewBox="0 0 24 24" width="36" height="36" aria-hidden="true"><path fill="currentColor" d="M7 4v16l13-8z"/></svg></span></button>
      <button id="mpNext" class="mp-b" aria-label="Piste suivante"><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path fill="currentColor" d="M12.5 12 3 5.5v13zM21.5 12 12 5.5v13z"/></svg></button>
      <button id="mpRepeat" class="mp-b dim" aria-label="Répéter l'album" aria-pressed="false"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M7 7h10v3l4-4-4-4v3H5v6h2zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2z"/></svg></button>
    </div>
    <div class="mp-now"><img id="mpJacket" alt="" hidden><div class="mp-info"><b id="mpTitle"></b><span id="mpSub"></span></div><span class="mp-t"><span id="mpTime">0:00</span> / <span id="mpDur">0:00</span></span><input id="mpSeek" type="range" min="0" max="1000" step="1" value="0" aria-label="Position dans le morceau"></div>
    <div class="mp-right">
      <button id="mpList" class="mp-b" aria-label="Ouvrir l'album"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M3 6h2v2H3zm4 0h14v2H7zM3 11h2v2H3zm4 0h14v2H7zm-4 5h2v2H3zm4 0h14v2H7z"/></svg></button>
      <button id="mpClose" class="mp-b" aria-label="Fermer le lecteur"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12 19 17.6 17.6 19 12 13.4 6.4 19 5 17.6 10.6 12 5 6.4z"/></svg></button>
    </div>
  </div>

  <script src="../vendor/maplibre/maplibre-gl.js"></script>
  <script src="app.js"></script>
</body>
</html>
